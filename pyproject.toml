[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqsecure"
version = "0.1.0"
description = "Defensive validation and explainable screening of DNA sequence files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.83,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
seqsecure = "seqsecure.validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
